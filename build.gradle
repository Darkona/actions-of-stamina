plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = System.getenv("GITHUB_HASH") ?: "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = archive_name
}

// Minecraft 1.18.2 runs on Java 17: compile for it and run the game on it.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // Boot check (scripts/client-boot-check.sh): 1.18.2 can't open a singleplayer world from the command line, so a
        // dedicated server of its own (run/bootserver) hosts a copy of the test world and the headless client joins it.
        // Named after the project: other projects' boot checks kill processes whose arguments name a "bootCheck" run.
        aosBootServer {
            server()
            gameDirectory = project.file('run/bootserver')
            programArguments.addAll '--nogui', '--port', project.findProperty('bootCheckPort') ?: '25699'
        }
        aosBoot {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--username', 'AoSBoot',
                    '--server', 'localhost', '--port', project.findProperty('bootCheckPort') ?: '25699'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.env.remapRefMap', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.compat.mixins.json"
}

// 'localRuntime': present when running the game from the dev environment, never published as a dependency.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    // modLocalRuntime: mods on the dev runtime only, remapped like the other mod dependencies.
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Forge 40 doesn't ship MixinExtras: bundled in the jar.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}"))

    // Feathers of Fatigue is optional: AoS compiles against its API only and falls back to its internal stamina
    // without it. Dev runs load the full mod unless -PwithoutFeathers is given.
    modCompileOnly "com.darkona.feathersoffatigue:feathers-of-fatigue-api:${feathers_of_fatigue_version}"
    if (!project.hasProperty('withoutFeathers')) {
        modLocalRuntime "com.darkona.feathersoffatigue:feathers-of-fatigue:${feathers_of_fatigue_version}"
    }

    // Optional compatibility targets. All direct use sits behind ModList checks and bridge classes.
    modCompileOnly "curse.maven:paragliders-289240:${paragliders_file_id}"
    modCompileOnly "maven.modrinth:parcool:${parcool_version}"
    modCompileOnly "maven.modrinth:better-combat:${bettercombat_version}"
    modCompileOnly "maven.modrinth:combat-roll:${combatroll_version}"
    modCompileOnly "maven.modrinth:epic-fight:${epicfight_version}"
    modCompileOnly "maven.modrinth:wall-jump-txf:${walljump_version}"
    modCompileOnly "maven.modrinth:create:${create_version}"
    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"

    // -PwithCompat: boot dev runs with the compat targets, Curios and their required libraries.
    // Unlike on 1.20.1, ParCool, Curios and Epic Fight run together here: ParCool 3 has no Curios items (the traceur
    // gloves whose attribute modifiers recursed with Epic Fight's listener came with ParCool 4).
    if (project.hasProperty('withCompat')) {
        modLocalRuntime "curse.maven:paragliders-289240:${paragliders_file_id}"
        modLocalRuntime "maven.modrinth:parcool:${parcool_version}"
        modLocalRuntime "maven.modrinth:better-combat:${bettercombat_version}"
        modLocalRuntime "maven.modrinth:combat-roll:${combatroll_version}"
        modLocalRuntime "maven.modrinth:epic-fight:${epicfight_version}"
        modLocalRuntime "maven.modrinth:wall-jump-txf:${walljump_version}"
        modLocalRuntime "maven.modrinth:playeranimator:${playeranimator_version}"
        modLocalRuntime "maven.modrinth:cloth-config:${clothconfig_version}"
        // Create carries its libraries (Flywheel, Registrate) inside its own jar.
        modLocalRuntime "maven.modrinth:create:${create_version}"
        modLocalRuntime "top.theillusivec4.curios:curios-forge:${curios_version}"
    }
}

// Expands ${} properties in src/main/templates (mods.toml) into the resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            forge_version              : forge_version,
            forge_version_range        : forge_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            feathers_of_fatigue_version_range: feathers_of_fatigue_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors,
                "MixinConfigs"            : "${mod_id}.mixins.json,${mod_id}.compat.mixins.json"
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archive_name
            from components.java
        }
    }
    repositories {
        maven {
            name = "GithubPackages"
            url = "https://maven.pkg.github.com/NewWind-Modpacks/actions-of-stamina"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
