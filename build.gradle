plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_label}-${mod_version}"
group = mod_group_id

base {
    archivesName = archive_name
}

// Minecraft 26.1 runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// src/disabled keeps the compats of mods without a NeoForge build for this Minecraft version (see its README). It is not
// a source set: nothing there is compiled or packaged.

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        // A normal client with the play pack, in its own game dir so test runs never touch its worlds.
        play {
            client()
            gameDirectory = project.file('run-play')
        }

        // Headless client straight into run/saves/aosboot: `xvfb-run -a ./gradlew runBootCheck`.
        bootCheck {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--quickPlaySingleplayer', 'aosboot'
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            // Only this mod's tests: the game test server runs every test in the registry unless told which.
            programArguments.addAll '--tests', "${project.mod_id}:*"
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The play pack loads when runPlay is requested (or with -PplayPack).
def playPack = project.hasProperty('playPack') || gradle.startParameter.taskNames.any { it.toLowerCase().contains('runplay') }

// 'localRuntime': present when running the game from the dev environment, never published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    localRuntime
}

dependencies {
    // Feathers of Fatigue is optional: AoS compiles against its API only and falls back to its internal stamina
    // without it. Dev runs load the full mod unless -PwithoutFeathers is given.
    compileOnly "com.darkona.feathersoffatigue:feathers-of-fatigue-api:${feathers_of_fatigue_version}"
    if (!project.hasProperty('withoutFeathers')) {
        localRuntime "com.darkona.feathersoffatigue:feathers-of-fatigue:${feathers_of_fatigue_version}"
    }

    // Optional compatibility targets. All direct use sits behind ModList checks and bridge classes.
    compileOnly "maven.modrinth:paragliders:${paragliders_version}"
    compileOnly "maven.modrinth:better-combat:${bettercombat_version}"
    compileOnly "maven.modrinth:combat-roll:${combatroll_version}"
    compileOnly "maven.modrinth:wall-jump-txf:${walljump_version}"
    compileOnly "maven.modrinth:curios:${curios_version}"

    // -PwithCompat: boot dev runs with the compat targets and their required libraries.
    if (project.hasProperty('withCompat')) {
        localRuntime "maven.modrinth:paragliders:${paragliders_version}"
        localRuntime "maven.modrinth:better-combat:${bettercombat_version}"
        localRuntime "maven.modrinth:combat-roll:${combatroll_version}"
        localRuntime "maven.modrinth:wall-jump-txf:${walljump_version}"
        localRuntime "maven.modrinth:player-animation-library:${playeranimation_version}"
        localRuntime "maven.modrinth:cloth-config:${clothconfig_version}"
        localRuntime "maven.modrinth:curios:${curios_version}"
    }

    // `./gradlew runPlay`: a pack to play with by hand. Feathers of Fatigue with its season and thirst compats, and the
    // action mods that sit well together (no Paragliders: it replaces too much of the game).
    if (playPack) {
        localRuntime "maven.modrinth:better-combat:${bettercombat_version}"
        localRuntime "maven.modrinth:combat-roll:${combatroll_version}"
        localRuntime "maven.modrinth:wall-jump-txf:${walljump_version}"
        localRuntime "maven.modrinth:player-animation-library:${playeranimation_version}"
        localRuntime "maven.modrinth:cloth-config:${clothconfig_version}"
        localRuntime "maven.modrinth:curios:${curios_version}"
        localRuntime "maven.modrinth:serene-seasons:${serene_seasons_version}"
        localRuntime "maven.modrinth:glitchcore:${glitchcore_version}"
        localRuntime "com.darkona.dropletsofthirst:droplets-of-thirst:${droplets_of_thirst_version}"
        localRuntime "maven.modrinth:appleskin:${appleskin_version}"
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
}

// Expands ${} properties in src/main/templates (neoforge.mods.toml) into the resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : project.version.toString(),
            mod_authors                : mod_authors,
            feathers_of_fatigue_version_range: feathers_of_fatigue_version_range,
            paragliders_range          : paragliders_range,
            bettercombat_range         : bettercombat_range,
            combatroll_range           : combatroll_range,
            walljump_range             : walljump_range,
            curios_range               : curios_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archive_name
            from components.java
        }
    }
    repositories {
        maven {
            name = "GithubPackages"
            url = "https://maven.pkg.github.com/NewWind-Modpacks/actions-of-stamina"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
