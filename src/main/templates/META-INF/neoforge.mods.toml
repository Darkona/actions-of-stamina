modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "aos.png"
authors = "${mod_authors}"
description = '''
Actions cost stamina: vanilla actions and other mods' actions (ParCool, Paragliders, Better Combat, Combat Roll, Epic Fight, Wall-Jump TXF, Gliders, Create). Uses Green Feathers when installed, or its own light stamina bar.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.compat.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "greenfeathers"
type = "optional"
versionRange = "${greenfeathers_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "paraglider"
type = "optional"
versionRange = "[21.1,)"
# NONE: ParCool orders itself BEFORE Paragliders, and AoS must come BEFORE ParCool (below).
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "parcool"
type = "optional"
versionRange = "[4.0,)"
# BEFORE: ParCool posts its stamina type registration event from its constructor, so AoS must be constructed first
# to add its listener to ParCool's mod bus.
ordering = "BEFORE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "bettercombat"
type = "optional"
versionRange = "[2.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "combat_roll"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "epicfight"
type = "optional"
versionRange = "[21.17,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "walljump"
type = "optional"
versionRange = "[1.21.1-1.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "vc_gliders"
type = "optional"
versionRange = "[1.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[6.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[9.0,)"
ordering = "NONE"
side = "BOTH"
