pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'actionsofstamina'

def jdlibDir = file(providers.gradleProperty('jdlibDir').getOrElse('../JDLib'))
if (jdlibDir.isDirectory()) {
    includeBuild(jdlibDir)
}
