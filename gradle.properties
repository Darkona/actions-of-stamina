org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.1.2
java_version=25
# Minecraft version in the jar and mod version: the name of the branch (26.1.2)
minecraft_label=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.112
neo_version_range=[26.1.2.112,)
loader_version_range=[4,)

## Mod
mod_id=actionsofstamina
mod_name=Actions of Stamina
mod_license=All Rights Reserved
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.1
mod_group_id=com.ccr4ft3r
mod_authors=CCr4ft3r, Darkona
archive_name=actions-of-stamina

## Dependencies (Feathers of Fatigue is optional)
feathers_of_fatigue_version=26.1.2-1.0.1
feathers_of_fatigue_version_range=[26.1.2-1.0.0,26.1.2-2)

## Optional compat (compileOnly, guarded by ModList checks)
# Modrinth version ids for NeoForge 26.1.2 (the version number in the comment): many mods share version numbers between
# their NeoForge and Fabric files. Mods without a build for this Minecraft version are in src/disabled (see its README).
# Paragliders 26.1.2
paragliders_version=eWpsLK31
# Better Combat 3.2.2+26.1.2-neoforge
bettercombat_version=YPa9bdAg
# Combat Roll 3.0.1+26.1.2-neoforge
combatroll_version=st64SArf
# Wall-Jump TXF 26.1.2-1.3.8-neoforge
walljump_version=jaqjw5wT
# Curios 15.0.0+26.1.2: stamina wings worn in a curio slot
curios_version=dRnRThvD
# Versions the optional compats accept (mods.toml): from the version compiled against, up to the next major version.
paragliders_range=[26.1.2,26.2)
bettercombat_range=[3.2,4)
combatroll_range=[3.0,4)
walljump_range=[26.1.2-1.3,26.2)
curios_range=[15.0.0,16)
# Runtime-only libraries for -PwithCompat dev runs, required by Better Combat and Combat Roll:
# Player Animation Library 1.2.6, Cloth Config 26.1.154+neoforge
playeranimation_version=GiRAXABH
clothconfig_version=TimoYzse

# Mods for the `runPlay` pack (hands-on testing only; Modrinth version ids, the version number in the comment):
# Serene Seasons 26.1.2.0.4, GlitchCore 26.1.2.0.2, AppleSkin 3.0.9+mc26.1, Jade 26.1.11+neoforge.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository).
serene_seasons_version=OKhFVuHv
glitchcore_version=mYUbCfgT
appleskin_version=i8MiVItH
jade_version=5jKeKXwB
droplets_of_thirst_version=26.1.2-1.0.1
