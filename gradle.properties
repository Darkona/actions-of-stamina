org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.2
java_version=25
# Minecraft version in the jar and mod version: the short name of the branch (26.2 covers its hotfixes)
minecraft_label=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88
neo_version_range=[26.2.0.88,)
loader_version_range=[11,)

## Mod
mod_id=actionsofstamina
mod_name=Actions of Stamina
mod_license=All Rights Reserved
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.1
mod_group_id=com.ccr4ft3r
mod_authors=CCr4ft3r, Darkona
archive_name=actions-of-stamina

## Dependencies (Feathers of Fatigue is optional)
feathers_of_fatigue_version=26.2-1.0.1
feathers_of_fatigue_version_range=[26.2-1.0.1,26.2-2)

## Optional compat (compileOnly, guarded by ModList checks)
# Modrinth version ids for NeoForge 26.2 (the version number in the comment): many mods share version numbers between
# their NeoForge and Fabric files. Mods without a build for this Minecraft version are in src/disabled (see its README).
# Paragliders 26.2.1
paragliders_version=FTwrXq5l
# Better Combat 3.2.2+26.2-neoforge
bettercombat_version=5mMhM6lS
# Combat Roll 3.0.1+26.2-neoforge
combatroll_version=ICGdrcOg
# Wall-Jump TXF 26.2-1.3.8-neoforge
walljump_version=rgBTFiNv
# Curios 16.0.0+26.2: stamina wings worn in a curio slot
curios_version=BI7D0sbK
# Versions the optional compats accept (mods.toml): from the version compiled against, up to the next major version.
paragliders_range=[26.2,26.3)
bettercombat_range=[3.2,4)
combatroll_range=[3.0,4)
walljump_range=[26.2-1.3,26.3)
curios_range=[16.0.0,17)
# Runtime-only libraries for -PwithCompat dev runs, required by Better Combat and Combat Roll:
# Player Animation Library 1.2.6, Cloth Config 26.2.155+neoforge
playeranimation_version=Hq1CwB9w
clothconfig_version=zErG1kOw

# Mods for the `runPlay` pack (hands-on testing only; Modrinth version ids, the version number in the comment):
# Serene Seasons 26.1.2.0.6 (the newest build for 26.2 despite its number), GlitchCore 26.2.0.0.0, AppleSkin 3.0.10+mc26.2,
# Jade 26.2.10+neoforge.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository).
serene_seasons_version=MZd2wAtJ
glitchcore_version=POAebwFo
appleskin_version=slnk1Qah
jade_version=GBES6etT
droplets_of_thirst_version=26.2-1.0.0
