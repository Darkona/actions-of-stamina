org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

minecraft_version=1.21.11
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=1.21.11
minecraft_version_range=[1.21.11,1.22)
neo_version=21.11.45
neo_version_range=[21.11.42,)
loader_version_range=[4,)

## Mod
mod_id=actionsofstamina
mod_name=Actions Of Stamina
mod_license=All Rights Reserved
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=0.6.0
mod_group_id=com.ccr4ft3r
mod_authors=CCr4ft3r, Darkona
archive_name=actions-of-stamina

## Dependencies (Feathers of Fatigue is optional)
feathers_of_fatigue_version=1.21.11-2.0.0
feathers_of_fatigue_version_range=[1.21.11-2.0.0,1.21.11-3)

## Optional compat (compileOnly, guarded by ModList checks)
# Modrinth version ids for NeoForge 1.21.11 (the version number in the comment): many mods share version numbers between
# their NeoForge and Fabric files. ParCool comes from CurseForge (project and file id). Mods without a build for this
# Minecraft version are in src/disabled (see its README).
# Paragliders 21.11.0-beta.6
paragliders_version=L6hTL3QG
# Better Combat 3.1.0+1.21.11-neoforge
bettercombat_version=lkzLyXbV
# Combat Roll 3.0.1+1.21.11-neoforge
combatroll_version=znWrqNKk
# Wall-Jump TXF 1.21.11-1.3.8-neoforge
walljump_version=AJPBMttm
# Curios 14.0.0+1.21.11: stamina wings worn in a curio slot
curios_version=MPGhs9Rw
# ParCool 1.21.11-3.4.3.3 (NeoForge), CurseForge file 7894158
parcool_version=482378:7894158
# Versions the optional compats accept (mods.toml): from the version compiled against, up to the next major version.
paragliders_range=[21.11.0-beta.6,21.12)
bettercombat_range=[3.1,4)
combatroll_range=[3.0,4)
walljump_range=[1.21.11-1.3,1.21.12)
curios_range=[14.0.0,15)
parcool_range=[3.4.3,3.5)
# Runtime-only libraries for -PwithCompat dev runs, required by Better Combat and Combat Roll:
# Player Animation Library 1.1.10, Cloth Config 21.11.153+neoforge
playeranimation_version=X39o2UJS
clothconfig_version=Wsus0EWg

# Mods for the `runPlay` pack (hands-on testing only; Modrinth version ids, the version number in the comment):
# Serene Seasons 21.11.0.5, GlitchCore 21.11.0.4, AppleSkin 3.0.8+mc1.21.11, Jade 21.1.7+neoforge.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository).
serene_seasons_version=IsO9cQ47
glitchcore_version=6dbbrOrO
appleskin_version=MH9ov9DW
jade_version=LDFqgwEA
droplets_of_thirst_version=1.21.11-1.0.0
