org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.3
# Minecraft version in the jar and mod version: the short name of the branch (26.3 covers its hotfixes)
minecraft_label=26.3
minecraft_version_range=[26.3,26.4)
# NeoForge 26.3 is in beta. 26.3.0.37-beta renames the config types (COMMON and SERVER become LOCAL and SYNCED): a
# jar built against one side of that change does not load on the other. Built against 26.3.0.36-beta, like Feathers
# of Fatigue 26.3-2.0.0.
neo_version=26.3.0.36-beta
neo_version_range=[26.3.0.36-beta,26.3.0.37-beta)
loader_version_range=[12,)

## Mod
mod_id=actionsofstamina
mod_name=Actions Of Stamina
mod_license=All Rights Reserved
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=0.6.0
mod_group_id=com.ccr4ft3r
mod_authors=CCr4ft3r, Darkona
archive_name=actions-of-stamina

## Dependencies (Feathers of Fatigue is optional)
feathers_of_fatigue_version=26.3-2.0.0
feathers_of_fatigue_version_range=[26.3-2.0.0,26.3-3)

## Optional compat (compileOnly, guarded by ModList checks)
# Modrinth version ids for NeoForge 26.3 (the version number in the comment): many mods share version numbers between
# their NeoForge and Fabric files. Mods without a build for this Minecraft version are in src/disabled (see its README).
# Better Combat 3.2.2+26.3-neoforge
bettercombat_version=RbEnSa47
# Combat Roll 3.0.1+26.3-neoforge
combatroll_version=oWAfRuBp
# Wall-Jump TXF 26.3-1.3.8-neoforge
walljump_version=EtZru8Mv
# Curios 17.0.0-beta.2+26.3, the only builds for 26.3 are betas: stamina wings worn in a curio slot
curios_version=LeVAnMq4
# Versions the optional compats accept (mods.toml): from the version compiled against, up to the next major version.
bettercombat_range=[3.2,4)
combatroll_range=[3.0,4)
walljump_range=[26.3-1.3,26.4)
curios_range=[17.0.0-beta.2,18)
# Runtime-only libraries for -PwithCompat dev runs, required by Better Combat and Combat Roll:
# Player Animation Library 1.2.7 (beta, the only build for 26.3), Cloth Config 26.3.159+neoforge
playeranimation_version=kemJXVHZ
clothconfig_version=GchRXPnb

# Mods for the `runPlay` pack (hands-on testing only; Modrinth version ids, the version number in the comment):
# Serene Seasons 26.1.2.0.7 (the build for 26.3 despite its number), GlitchCore 26.3.0.0.3, AppleSkin 3.0.10+mc26.3,
# Jade 26.3.1+neoforge.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository).
serene_seasons_version=QnvW5HPm
glitchcore_version=5FMzBcg1
appleskin_version=6vok7cLb
jade_version=bzrrwapQ
droplets_of_thirst_version=26.3-1.0.0
