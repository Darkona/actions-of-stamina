name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tag, version and branch
        run: |
          label=$(grep '^minecraft_label=' gradle.properties | cut -d= -f2)
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          [ "$GITHUB_REF_NAME" = "v${label}-${version}" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match v${label}-${version} in gradle.properties"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${label}" || { echo "::error::$GITHUB_SHA is not on branch ${label}"; exit 1; }
          echo "JAVA_VERSION=$(grep '^java_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Sibling mods
        run: .github/ci-deps.sh release

      # Two invocations: a GameTest task in the same invocation adds the test data to the resources, and the
      # sources jar would then pack it twice.
      - name: Build
        run: ./gradlew build

      - name: GameTests
        run: ./gradlew runGameTestServer

      - name: GitHub release
        run: |
          # actions/checkout leaves an annotated tag as a lightweight one; fetch it again for its message.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          pre=""; case "$GITHUB_REF_NAME" in *-beta*|*-alpha*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME" $pre
        env:
          GH_TOKEN: ${{ github.token }}
